{% extends "base.html" %}
{% block content %}
<div class="login">
  <form method="post" class="card">
    <h1 class="app-title">Νέος Λογαριασμός</h1>
    <p class="muted">Χρειάζεσαι τον κωδικό πρόσκλησης.</p>
    <label class="field-label" for="invite">Κωδικός πρόσκλησης</label>
    <input type="text" id="invite" name="invite" required autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus>
    <label class="field-label" for="username">Όνομα χρήστη</label>
    <input type="text" id="username" name="username" value="{{ username or '' }}" required
           minlength="3" maxlength="30" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    <label class="field-label" for="password">Κωδικός</label>
    <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
    <label class="field-label" for="confirm">Επιβεβαίωση κωδικού</label>
    <input type="password" id="confirm" name="confirm" required minlength="6" autocomplete="new-password">
    <button type="submit" class="btn btn-primary">Δημιουργία</button>
    <p class="muted switch">Έχεις ήδη λογαριασμό; <a href="{{ url_for('login') }}">Σύνδεση</a></p>
  </form>
</div>
{% endblock %}
