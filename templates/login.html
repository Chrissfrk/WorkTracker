{% extends "base.html" %}
{% block title %}Σύνδεση · Work Tracker{% endblock %}
{% block main_class %}auth{% endblock %}
{% block content %}
<div class="card auth-card">
  <header class="auth-header">
    <img class="auth-icon" src="{{ url_for('static', filename='icon.svg') }}" alt="" width="64" height="64">
    <h1 class="large-title">Work Tracker</h1>
    <p class="secondary">Διαχείριση Ωρών & Ταμείου</p>
  </header>
  <form method="post" class="stack">
    <div class="field">
      <label class="field-label" for="username">Όνομα χρήστη</label>
      <input type="text" id="username" name="username" value="{{ username or '' }}" required
             autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" {% if not username %}autofocus{% endif %}>
    </div>
    <div class="field">
      <label class="field-label" for="password">Κωδικός</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" {% if username %}autofocus{% endif %}>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Σύνδεση</button>
  </form>
</div>
{% if registration_open %}
<p class="auth-switch">Δεν έχεις λογαριασμό; <a href="{{ url_for('register') }}">Δημιουργία λογαριασμού</a></p>
{% endif %}
{% endblock %}
